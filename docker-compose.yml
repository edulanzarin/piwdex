# Compose igual em dev e producao (app + db + migrations).
# Slug `piwdex` governa o nome de tudo. Ver [[Infra]]. Par de portas: app 4070 / banco 5070.
name: ${COMPOSE_PROJECT_NAME:-piwdex}

services:
  piwdex-db:
    image: postgres:17-alpine
    container_name: piwdex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-piwdex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-piwdex}
      POSTGRES_DB: ${POSTGRES_DB:-piwdex}
    ports:
      - "${DB_PORT:-5070}:5432"
    volumes:
      - piwdex-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-piwdex} -d ${POSTGRES_DB:-piwdex}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [piwdex-net]

  # Migrations rodam em container proprio, no boot, e saem.
  # Ver [[Migrations em container proprio no Docker Compose]].
  piwdex-migrate:
    build:
      context: .
      target: migrate
    image: piwdex-migrate
    container_name: piwdex-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-piwdex}:${POSTGRES_PASSWORD:-piwdex}@piwdex-db:5432/${POSTGRES_DB:-piwdex}
    command: ["node", "db/setup.mjs"]
    depends_on:
      piwdex-db:
        condition: service_healthy
    networks: [piwdex-net]

  piwdex-app:
    build:
      context: .
      target: runner
    image: piwdex-app
    container_name: piwdex-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-piwdex}:${POSTGRES_PASSWORD:-piwdex}@piwdex-db:5432/${POSTGRES_DB:-piwdex}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GAME_HOST: ${GAME_HOST:-https://poke.idleworld.online}
      APP_URL: ${APP_URL:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "${APP_PORT:-4070}:3000"
    depends_on:
      piwdex-db:
        condition: service_healthy
      piwdex-migrate:
        condition: service_completed_successfully
    networks: [piwdex-net]

  # Worker do sniper: bate /api/cron/scan a cada SCAN_INTERVAL (s), autenticado por
  # CRON_SECRET. E o que faz o alerta pegar o anuncio com o site fechado. So leitura
  # do jogo (mercado/conta) -> grava notificacoes; nao escreve na conta do jogador.
  piwdex-worker:
    image: curlimages/curl:8.11.1
    container_name: piwdex-worker
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
    entrypoint: ["sh", "-c"]
    command:
      - >
        while true; do
          curl -fsS -X POST -H "x-cron-secret: $$CRON_SECRET"
            http://piwdex-app:3000/api/cron/scan >/dev/null 2>&1 || true;
          sleep "$$SCAN_INTERVAL";
        done
    depends_on:
      piwdex-app:
        condition: service_started
    networks: [piwdex-net]

volumes:
  piwdex-db-data:
    name: piwdex-db-data

networks:
  piwdex-net:
    name: piwdex-net
