<svg viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Itens</title>
  <!-- #46e08a color-t-itens · #2a9c5c sombra · #84f0b4 luz · #1c6b3d oclusão
       #cdbba3 color-accent · #927b5d color-accent-soft · #171310 contorno
       luz: alto-esquerda -->
  <ellipse cx="64" cy="117" rx="34" ry="6.5" fill="#000" opacity=".3"/>

  <!-- a moeda, atrás da bolsa e saindo por cima -->
  <g id="moeda">
    <circle cx="92" cy="34" r="15" fill="#171310"/>
    <circle cx="92" cy="34" r="12" fill="#cdbba3"/>
    <path d="M92 22a12 12 0 0 1 0 24 12 12 0 0 0 0-24z" fill="#927b5d"/>
    <circle cx="92" cy="34" r="6.5" fill="none" stroke="#927b5d" stroke-width="2"/>
    <ellipse cx="87" cy="28" rx="3.6" ry="2.4" fill="#f0ecea" opacity=".85" transform="rotate(-30 87 28)"/>
  </g>

  <!-- cordão -->
  <g fill="none" stroke="#171310" stroke-width="7" stroke-linecap="round">
    <path d="M44 44q-12-2-16-12"/><path d="M84 44q12-2 16-12"/>
  </g>
  <g fill="none" stroke="#cdbba3" stroke-width="3.5" stroke-linecap="round">
    <path d="M44 44q-12-2-16-12"/><path d="M84 44q12-2 16-12"/>
  </g>

  <!-- o CORPO: a cintura é o que faz ler bolsa. Sem o estrangulamento logo
       abaixo da boca, qualquer forma que afina em cima vira montanha. -->
  <path id="contorno" d="M50 44h28c3 0 5 3 4 6l-3 9c14 6 24 19 24 33 0 17-17 26-39 26S25 109 25 92c0-14 10-27 24-33l-3-9c-1-3 1-6 4-6z" fill="#171310"/>
  <path d="M52 47h24c2 0 3 2 2.6 4l-3.4 10.5c13.4 5 23.8 17 23.8 30.5 0 15-15.6 23-36 23s-36-8-36-23c0-13.5 10.4-25.5 23.8-30.5L47.4 51c-.6-2 .6-4 2.6-4z" fill="#46e08a"/>
  <path d="M76 47c2 0 3 2 2.6 4l-3.4 10.5c13.4 5 23.8 17 23.8 30.5 0 15-15.6 23-36 23-3 0-6-.2-8.8-.6C71 113 89 105 89 91c0-13-9.6-24.6-22.4-29.4L70 51c.4-2-.6-4-2.6-4z" fill="#2a9c5c"/>
  <path d="M28 100c6 8 19 12 36 12s30-4 36-12c-2 12-16 18-36 18s-34-6-36-18z" fill="#1c6b3d"/>
  <path d="M52 47h10l-3 14c-11 5-19 14-21 24-2-13 5-25 17-31L52.6 51c-.4-2 .4-4 1.4-4z" fill="#84f0b4"/>

  <!-- a boca franzida -->
  <rect x="42" y="36" width="44" height="16" rx="5" fill="#171310"/>
  <rect x="45" y="38.5" width="38" height="11" rx="3.5" fill="#cdbba3"/>
  <g fill="#927b5d">
    <rect x="53" y="38.5" width="3.5" height="11"/><rect x="62" y="38.5" width="3.5" height="11"/>
    <rect x="71" y="38.5" width="3.5" height="11"/>
  </g>
  <rect x="45" y="38.5" width="38" height="3" rx="1.5" fill="#f0ecea" opacity=".55"/>

  <!-- o fecho: o detalhe FRIO, um por ícone -->
  <circle cx="64" cy="82" r="12" fill="#171310"/>
  <circle cx="64" cy="82" r="9" fill="#3aa0d8"/>
  <path d="M64 73a9 9 0 0 1 0 18 9 9 0 0 0 0-18z" fill="#1d6b96"/>
  <path d="M64 75.5l2.6 4h4.9l-4 3.2 1.6 4.8-5.1-3-5.1 3 1.6-4.8-4-3.2h4.9z" fill="#7fd0f5"/>
  <ellipse cx="60" cy="77" rx="2.6" ry="1.8" fill="#fff" opacity=".8" transform="rotate(-30 60 77)"/>
</svg>
