    <path d="M96 20c3-4 9-3 9 2 0 5-9 11-9 11s-9-6-9-11c0-5 6-6 9-2z" opacity=".9"/>
    <path d="M28 34c2-3 6-2 6 1.4 0 3.4-6 7.6-6 7.6s-6-4.2-6-7.6C22 32 26 31 28 34z" opacity=".65"/>
  </g>

  <!-- o OVO. Ele é mais estreito em cima: ovo simétrico lê como bola. -->
