    <ellipse cx="74" cy="65" rx="6.5" ry="5.6"/><ellipse cx="55" cy="73" rx="5" ry="4.4"/>
  </g>
  <g fill="#b04a80" opacity=".5">
    <ellipse cx="74" cy="66.5" rx="6.5" ry="4"/><ellipse cx="72" cy="42.5" rx="5.5" ry="3"/>
  </g>

  <!-- o NINHO: é ele que ancora o ovo. Sem base, o ovo boia. -->
