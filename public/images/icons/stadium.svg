<svg viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Stadium</title>
  <!-- #c9e94d color-t-stadium · #8fae2a sombra · #e8fa9a luz · #5c7414 oclusão
       #8f9aa8 metal da haste · luz: alto-esquerda -->
  <ellipse cx="64" cy="120" rx="38" ry="5" fill="#000" opacity=".3"/>

  <!-- A MASSA CLARA é o CAMPO, e não a arquibancada.
       A primeira versão fez o contrário: anel claro com miolo escuro. No tamanho
       de uso aquilo era uma rosca com dois palitos atrás — a figura mais próxima
       que o olho tinha pra fechar. Estádio se reconhece pelo gramado aceso
       cercado de escuro, que é como ele aparece em toda foto noturna, e a
       inversão resolveu sozinha o que nenhum detalhe a mais tinha resolvido. -->

  <g id="refletores">
    <rect x="10" y="30" width="13" height="66" rx="5" fill="#171310"/>
    <rect x="12.5" y="32" width="8" height="62" rx="3.5" fill="#8f9aa8"/>
    <rect x="12.5" y="32" width="3" height="62" rx="1.5" fill="#dbe2ea"/>
    <rect x="105" y="30" width="13" height="66" rx="5" fill="#171310"/>
    <rect x="107.5" y="32" width="8" height="62" rx="3.5" fill="#6d7885"/>

    <!-- As cabeças INCLINAM pro centro. Retas elas eram duas placas paralelas e
         a peça virava um portão; inclinadas, elas apontam pro campo e as três
         partes viram uma cena só. -->
    <g transform="rotate(16 24 22)">
      <rect x="4" y="10" width="36" height="24" rx="6" fill="#171310"/>
      <rect x="7.5" y="13.5" width="29" height="17" rx="3.5" fill="#8fae2a"/>
      <rect x="7.5" y="13.5" width="29" height="8" rx="3.5" fill="#e8fa9a"/>
      <g fill="#fff" opacity=".85">
        <circle cx="14" cy="17.5" r="2.4"/><circle cx="22" cy="17.5" r="2.4"/><circle cx="30" cy="17.5" r="2.4"/>
      </g>
    </g>
    <g transform="rotate(-16 104 22)">
      <rect x="88" y="10" width="36" height="24" rx="6" fill="#171310"/>
      <rect x="91.5" y="13.5" width="29" height="17" rx="3.5" fill="#5c7414"/>
      <rect x="91.5" y="13.5" width="29" height="8" rx="3.5" fill="#8fae2a"/>
      <g fill="#e8fa9a" opacity=".7">
        <circle cx="98" cy="17.5" r="2.4"/><circle cx="106" cy="17.5" r="2.4"/><circle cx="114" cy="17.5" r="2.4"/>
      </g>
    </g>
  </g>

  <!-- O facho, atrás do bowl: é ele que amarra torre e campo numa cena só. -->
  <g fill="#e8fa9a" opacity=".14">
    <path d="M24 34 L74 74 L40 92 Z"/>
    <path d="M104 34 L54 74 L88 92 Z"/>
  </g>

  <!-- A ARQUIBANCADA: escura, e só um fio de luz na aresta de cima-esquerda. -->
  <ellipse cx="64" cy="86" rx="54" ry="34" fill="#171310"/>
  <ellipse cx="64" cy="84.5" rx="50" ry="30" fill="#5c7414"/>
  <path d="M14 84.5a50 30 0 0 1 50-30" fill="none" stroke="#8fae2a" stroke-width="8" stroke-linecap="round"/>
  <path d="M23 78a41 21 0 0 1 32-17" fill="none" stroke="#c9e94d" stroke-width="3.4" stroke-linecap="round" opacity=".85"/>

  <!-- O CAMPO ACESO. É a maior área clara da peça, e é ela que a silhueta
       entrega antes de qualquer cor. -->
  <ellipse cx="64" cy="86.5" rx="33" ry="19" fill="#171310"/>
  <ellipse cx="64" cy="85.5" rx="29.5" ry="16" fill="#c9e94d"/>
  <path d="M38 78a29.5 16 0 0 1 22-8.2" fill="none" stroke="#e8fa9a" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#5c7414" stroke-width="2.6" stroke-linecap="round">
    <path d="M64 70v31"/>
    <circle cx="64" cy="85.5" r="6.5"/>
    <path d="M41 78.5h6M81 78.5h6M41 92.5h6M81 92.5h6"/>
  </g>
</svg>
