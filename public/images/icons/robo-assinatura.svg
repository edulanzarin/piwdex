<svg viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Assinatura</title>
  <!-- #a78bfa color-t-robo · #6f52c9 sombra · #d8c9ff luz · #3a2a6b oclusão
       #ffb454 a estrela do passe · luz: alto-esquerda -->
  <ellipse cx="64" cy="118" rx="30" ry="6" fill="#000" opacity=".3"/>

  <!-- O PASSE deitado, com a tarja escura atravessando: é a forma que já
       significa "cartão" sem precisar de nada escrito nele. A estrela é o que
       separa este passe de um meio de pagamento qualquer. -->
  <rect x="10" y="30" width="108" height="70" rx="14" fill="#171310"/>
  <rect x="14" y="34" width="100" height="62" rx="11" fill="#a78bfa"/>
  <path d="M64 34h39a11 11 0 0 1 11 11v40a11 11 0 0 1-11 11H64z" fill="#6f52c9"/>
  <path d="M25 34h78a11 11 0 0 1 9 5H16a11 11 0 0 1 9-5z" fill="#d8c9ff" opacity=".5"/>
  <rect x="14" y="46" width="100" height="15" fill="#3a2a6b"/>

  <path d="M42 66 47 76l11 1.6-8 7.7 2 11-10-5.2-10 5.2 2-11-8-7.7 11-1.6z" fill="#171310" transform="translate(-1 -1) scale(1.06) translate(-2 -4)"/>
  <path d="M42 66 47 76l11 1.6-8 7.7 2 11-10-5.2-10 5.2 2-11-8-7.7 11-1.6z" fill="#ffb454"/>
  <path d="M42 66 47 76l11 1.6-8 7.7 2 11-10-5.2z" fill="#c07f2e"/>

  <g fill="#d8c9ff" opacity=".85"><rect x="66" y="70" width="40" height="7" rx="3.5"/><rect x="66" y="82" width="26" height="7" rx="3.5"/></g>
</svg>
