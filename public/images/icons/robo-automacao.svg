    <rect x="55" y="4" width="18" height="26" rx="5"/><rect x="55" y="98" width="18" height="26" rx="5"/>
    <rect x="4" y="55" width="26" height="18" rx="5"/><rect x="98" y="55" width="26" height="18" rx="5"/>
