       #ffb454 o ouro · #c07f2e a sombra dele · luz: alto-esquerda -->
  <ellipse cx="64" cy="118" rx="30" ry="6" fill="#000" opacity=".3"/>

  <!-- SACOLA com a moeda saindo dela. A moeda é obrigatória: sacola sozinha é
       "compras", e esta aba também VENDE. O que as duas pontas têm em comum é
       o ouro, então o ouro é o assunto.
       DUAS alças e uma dobra no topo, e não uma alça central: com uma alça só
       o corpo lia como BALDE, que é outro objeto e outra ideia. -->
